      }
      function render() {
        const isAdmin = state.role === "admin";
        document
          .querySelector("#phoneWrap")
          .classList.toggle("hidden", isAdmin);
        document.querySelector("#desktop").classList.toggle("active", isAdmin);
        document.querySelector("#review").style.display = isAdmin
          ? "none"
          : "block";
        if (isAdmin) {
          document.querySelector("#desktop").innerHTML = admin();
          document.querySelector("#stageTitle").textContent =
            `公司内部PC后台｜${state.adminPage === "list" ? "项目管理" : "新建项目"}`;
          return;
        }
        const titles = {
          home: "小联帮你链",
          list: "找项目",
          types: "发布项目",
          form: "发布项目",
          detail: "项目详情",
          manage: state.role === "federation" ? "项目管理" : "我的项目",
        };
        titleEl.textContent = titles[state.page] || "小联帮你链";
        document.querySelector("#stageTitle").textContent =
          `${{ publisher: "会员端", viewer: "会员端（无发布权限）", federation: "工商联端" }[state.role]}｜${titles[state.page]}`;
        pageEl.innerHTML =
          state.page === "home"
            ? home()
            : state.page === "list"
              ? list()
              : state.page === "types"
                ? typeSelect()
                : state.page === "form"
                  ? form()
                  : state.page === "detail"
                    ? detail(state.selected)
                    : manage();
        document.querySelector("#review").innerHTML = review();
      }
      function editProject(v) {
        state.selected = types.find((t) => t.value === v);
        state.parsed = true;
        state.authorized = true;
        state.selectedTags = [...state.selected.cats];
        go("form");
      }
      function openDetail(id) {
        state.selected =
          projectSamples.find((t) => t.displayId === id) ||
          types.find((t) => t.value === id);
        go("detail");
      }
      function saveProject() {
        if (!state.parsed) return toast("请先完成来源解析");
        toast("已保存为未上架");
        setTimeout(() => go("manage"), 700);
      }
      function doCta(v) {
        const t = types.find((x) => x.value === v);
        const msgs = {
          official_account: "正在进入公众号主页：西城区企业服务",
          mini_program_link: "微信将确认是否打开目标小程序页面",
          external_web: "网址已复制，请前往浏览器打开",
          basic_info: "即将拨打：138****3876",
        };
        toast(msgs[v] || t?.cta || "打开项目");
      }
      document.querySelector(".controls .sub").textContent =
        "高保真交互原型 v0.7";
      document.querySelector(".controls .rule").textContent =
        "v0.7交互提示：公众号授权后只读取账号基础信息并直接生成项目字段，不再拉取或展示文章；项目介绍的解析材料仅支持 DOC/DOCX，解析后自动挂接到相关附件。";
      document.querySelectorAll(".role").forEach(
        (b) =>
          (b.onclick = () => {
            document
              .querySelectorAll(".role")
              .forEach((x) => x.classList.remove("active"));
            b.classList.add("active");
            state.role = b.dataset.role;
            state.page = "home";
            state.adminPage = "list";
            state.stack = [];
            state.category = "全部";
            resetSource();
            render();
          }),
      );
      document.querySelectorAll(".page-jump").forEach(
        (b) =>
          (b.onclick = () => {
            if (state.role === "admin") return;
            go(b.dataset.page);
          }),
      );
      resetSource();
      render();
    </script>
  </body>
</html>
